[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "trainhub-backend"
version = "0.1.0"
description = "TrainHub backend — central ML training platform. No database, no client/user information [doc 01 §3]."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
trainhub = "app.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]
# Real trainers [doc 08 §2]. ``torch`` is NOT listed here: the CPU image installs
# torch==2.7.1+cpu from https://download.pytorch.org/whl/cpu (178 MB). The GPU
# image installs torch==2.7.1 from PyPI, which is the CUDA 12.6 build (821 MB)
# and pulls the nvidia-*-cu12 runtime wheels as dependencies (D70).
training = [
    "scikit-learn==1.9.1",
    # Hungarian matching for RT-DETR [S14b]; already pulled by scikit-learn,
    # declared explicitly because app/vendor/rtdetr/matcher.py imports it.
    "scipy==1.18.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored upstream RT-DETR (Apache-2.0) is third-party code: keep it out of
# our lint gates [S14a, D120].
exclude = ["app/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = ["app/vendor"]

[[tool.mypy.overrides]]
# Vendored upstream RT-DETR (Apache-2.0) is third-party code: keep it out of
# our type gates [S14a, D120]. `exclude` does not apply to files listed via
# `files`, so ignore the vendored package explicitly.
module = "app.vendor.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: integration/heavy tests; excluded from make verify and test-fast [doc 16 FAST-02]",
    "gpu: requires a CUDA GPU; run on the server with `make test-gpu` [doc 14 §3.5]",
]
filterwarnings = [
    "ignore:This process .* is multi-threaded.*:DeprecationWarning",
]
