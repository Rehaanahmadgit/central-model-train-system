[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "trainhub-backend"
version = "0.1.0"
description = "TrainHub backend — central ML training platform. No database, no client/user information [doc 01 §3]."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.3",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:This process .* is multi-threaded.*:DeprecationWarning",
]
