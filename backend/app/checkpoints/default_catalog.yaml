# Shipped catalog defaults [doc 07 §2, doc 14 §5].
#
# Every outbound field below is a PLACEHOLDER: real URLs and sha256 values must
# be supplied by the operator (TODO(user)). An entry with a placeholder sha256
# is "unverified" and the resolver refuses to download it, because sha256
# verification is mandatory [doc 10 §4]. Copy entries into
# $TRAINHUB_HOME/checkpoints/catalog.override.yaml to add or replace them
# without rebuilding the image.
