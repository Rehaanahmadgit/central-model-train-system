  version: "1.0"
  model_family: rtdetr
  task_types: [object_detection]
  pretrained_on: coco
  source_type: url
  source_uri: "TODO(user): provide the official RT-DETR-L weights URL"
  sha256: "TODO(user): provide the verified sha256"
  size_bytes: 0
  license: "TODO(user): provide the license"
  min_vram_gb: 4
  filename: rtdetr-l.pt
  notes: "Detection backbone; COCO pretrained."

