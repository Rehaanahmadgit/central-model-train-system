name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only: publishing stays TODO(user) — nothing is pushed automatically
      # (README "Build & publish the image": registry/token are not supplied).
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: cpu
          push: false
          tags: trainhub:0.1.0-cpu
          build-args: |
            GIT_COMMIT=${{ github.sha }}
      - name: Build GPU image (no build-args)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gpu
          push: false
          tags: trainhub:0.1.0-gpu
          # CUDA torch is baked into the Dockerfile — the GPU build takes no
          # build-args [doc 14 §4].
