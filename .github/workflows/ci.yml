name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # D54: runtime standardized on Python 3.12 (laptop = CI = Docker).
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./backend[dev,training]"
      - run: pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix frontend
      # Same gate as locally, full suite incl. slow crash tests [doc 16 FAST-02].
      - run: make verify-full PYTHON=python
